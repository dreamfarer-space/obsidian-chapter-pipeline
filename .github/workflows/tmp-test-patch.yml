name: Temporary coordinator test patch

on:
  push:
    branches: [refactor/issue-32-session-coordinator]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-32-session-coordinator
      - name: Update legacy session-map assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('main.test.js')
          text = path.read_text()
          replacements = [
              ("disabledHarness.plugin.viewSessions?.get(disabledHarness.view)", "disabledHarness.plugin.sessionCoordinator?.get(disabledHarness.view)"),
              ("liveHarness.plugin.viewSessions?.get(liveHarness.view)", "liveHarness.plugin.sessionCoordinator?.get(liveHarness.view)"),
              ("assert.equal(liveHarness.plugin.viewSessions.size, 0);", "assert.equal(liveHarness.plugin.sessionCoordinator, undefined);"),
              ("assert.ok(harness.plugin.viewSessions?.has(harness.view));", "assert.ok(harness.plugin.sessionCoordinator?.get(harness.view));"),
              ("assert.equal(harness.plugin.viewSessions?.has(harness.view), false);", "assert.equal(harness.plugin.sessionCoordinator?.get(harness.view), undefined);"),
              ("  assert.equal(harness.plugin.viewSessionVersions?.has(harness.view), false);\n", ""),
              ("harness.plugin.viewSessions?.get(harness.view)", "harness.plugin.sessionCoordinator?.get(harness.view)"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: read sessions through typed coordinator"
          git push origin HEAD:refactor/issue-32-session-coordinator
