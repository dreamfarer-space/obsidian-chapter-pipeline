name: Rebuild Issue 11 bundle

on:
  push:
    branches: [fix/issue-11-scroll-scope]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip bundle]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install tsc --noEmit
      - run: npm test
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- main.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "chore: rebuild production bundle [skip bundle]"
          git push
