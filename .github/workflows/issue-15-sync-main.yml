name: Issue 15 one-time main sync

on:
  push:
    branches:
      - chore/issue-15-community-submission-gate

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: chore/issue-15-community-submission-gate

      - name: Merge latest main while preserving issue 15 README additions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains main."
            exit 0
          fi

          set +e
          git merge --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            git checkout --ours README.md README.zh-CN.md
          fi

          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('README.md'): (
                  '<img src="assets/banner-en.png" alt="Chapter Pipeline banner" width="100%" />',
                  '<img src="assets/banner-en.svg" alt="Chapter Pipeline banner by 择梦舟" width="100%" />',
              ),
              Path('README.zh-CN.md'): (
                  '<img src="assets/banner-zh.png" alt="Chapter Pipeline 中文横幅" width="100%" />',
                  '<img src="assets/banner-zh.svg" alt="Chapter Pipeline 中文横幅，作者择梦舟" width="100%" />',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit(f'expected banner markup not found in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git add README.md README.zh-CN.md assets
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git commit -m "Merge main into issue #15 submission branch"
          git push origin HEAD:chore/issue-15-community-submission-gate
