name: Temporary reading snapshot override migration

on:
  push:
    branches: [refactor/issue-32-reading-snapshot-overrides]

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-32-reading-snapshot-overrides
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Move snapshot wrappers into typed subclass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f'expected patch context not found in {path_str}')

          replace_once(
              'src/reading-persistence.ts',
              '''function rememberFileChapterSnapshot(plugin: ReadingAwarePlugin, path: string, chapters: ChapterNode[]): void {\n''',
              '''export function rememberFileChapterSnapshot(\n  plugin: Pick<ReadingAwarePlugin, 'fileChapterSnapshots'>,\n  path: string,\n  chapters: ChapterNode[]\n): void {\n'''
          )

          replace_once(
              'src/reading-persistence.ts',
              '''  const legacyAttach = prototype.attachStepperToView;\n  if (typeof legacyAttach === 'function') {\n    prototype.attachStepperToView = async function (this: ReadingAwarePlugin, view: object) {\n      const rendered = await legacyAttach.call(this, view) as { chapters?: ChapterNode[] } | undefined;\n      const typedView = view as { file?: FileLike };\n      const chapters = rendered?.chapters ?? this.viewChapterSnapshots?.get(view);\n      if (typedView.file?.path && chapters?.length) rememberFileChapterSnapshot(this, typedView.file.path, chapters);\n      return rendered;\n    };\n  }\n\n  const legacyGetAllChapters = prototype.getAllChaptersForView;\n  if (typeof legacyGetAllChapters === 'function') {\n    prototype.getAllChaptersForView = async function (this: ReadingAwarePlugin, view: object): Promise<ChapterNode[]> {\n      const chapters = await legacyGetAllChapters.call(this, view) as ChapterNode[];\n      const path = (view as { file?: FileLike })?.file?.path;\n      if (path && chapters.length) rememberFileChapterSnapshot(this, path, chapters);\n      return chapters;\n    };\n  }\n\n''',
              ''''''
          )

          replace_once(
              'src/main.ts',
              '''import { installReadingIdentityPersistence } from './reading-persistence';\n''',
              '''import { installReadingIdentityPersistence, rememberFileChapterSnapshot } from './reading-persistence';\n'''
          )
          replace_once(
              'src/main.ts',
              '''  recordReadingPosition?: (view: object, chapter: ChapterNode) => void;\n}\n''',
              '''  recordReadingPosition?: (view: object, chapter: ChapterNode) => void;\n  getAllChaptersForView?: (view: object) => Promise<ChapterNode[]>;\n}\n'''
          )
          replace_once(
              'src/main.ts',
              '''    attachStepperToView?: (view: object) => Promise<LegacyRenderResult | undefined | void>;\n    onunload?: () => void;\n''',
              '''    attachStepperToView?: (view: object) => Promise<LegacyRenderResult | undefined | void>;\n    getAllChaptersForView?: (view: object) => Promise<ChapterNode[]>;\n    onunload?: () => void;\n'''
          )
          replace_once(
              'src/main.ts',
              '''const legacyAttach = LegacyPlugin.prototype.attachStepperToView;\nconst legacyUnload = LegacyPlugin.prototype.onunload;\n''',
              '''const legacyAttach = LegacyPlugin.prototype.attachStepperToView;\nconst legacyGetAllChaptersForView = LegacyPlugin.prototype.getAllChaptersForView;\nconst legacyUnload = LegacyPlugin.prototype.onunload;\n'''
          )
          replace_once(
              'src/main.ts',
              '''    } = rendered;\n    if (!chapters.length || !scroller) return;\n\n    releaseLegacyScrollTracking();\n''',
              '''    } = rendered;\n    const filePath = (typedView.file as { path?: string }).path;\n    if (filePath && chapters.length) rememberFileChapterSnapshot(this, filePath, chapters);\n    if (!chapters.length || !scroller) return;\n\n    releaseLegacyScrollTracking();\n'''
          )
          replace_once(
              'src/main.ts',
              '''  /** Refresh only views whose structural signature or mounted resources changed. */\n  updateAllMarkdownViews(): void {\n''',
              '''  /** Read all chapters through the compatibility base while keeping identity snapshots in typed ownership. */\n  async getAllChaptersForView(view: object): Promise<ChapterNode[]> {\n    if (!legacyGetAllChaptersForView) return [];\n    const chapters = await legacyGetAllChaptersForView.call(this, view);\n    const filePath = (view as { file?: { path?: string } })?.file?.path;\n    if (filePath && chapters.length) rememberFileChapterSnapshot(this, filePath, chapters);\n    return chapters;\n  }\n\n  /** Refresh only views whose structural signature or mounted resources changed. */\n  updateAllMarkdownViews(): void {\n'''
          )
          PY
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Commit migrated source and generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/reading-persistence.ts main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: move reading snapshot wrappers to typed subclass"
          git push origin HEAD:refactor/issue-32-reading-snapshot-overrides
