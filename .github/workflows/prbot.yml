name: PRBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  checks: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: prbot-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    if: ${{ github.event_name == 'pull_request' || (github.event.issue.pull_request && github.event.sender.type != 'Bot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Explain disabled PRBot
        if: ${{ env.OPENROUTER_API_KEY == '' }}
        run: echo 'PRBot skipped because OPENROUTER_API_KEY is not configured.'

      - name: Run PRBot
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        uses: jaibhasin/PRBot@v1.0.2
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
