name: Issue 15 Real Obsidian Smoke

on:
  push:
    branches:
      - chore/issue-15-community-submission-final

permissions:
  contents: read

jobs:
  smoke:
    name: Obsidian ${{ matrix.obsidian }} desktop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        obsidian: ['0.15.9', '1.13.7']

    steps:
      - name: Check out plugin
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download archived Obsidian AppImage
        shell: bash
        env:
          OBSIDIAN_VERSION: ${{ matrix.obsidian }}
        run: |
          set -euo pipefail
          url="https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/Obsidian-${OBSIDIAN_VERSION}.AppImage"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/obsidian.AppImage" "$url"
          chmod +x "$RUNNER_TEMP/obsidian.AppImage"
          cd "$RUNNER_TEMP"
          ./obsidian.AppImage --appimage-extract >/dev/null
          mv squashfs-root "obsidian-${OBSIDIAN_VERSION}"
          test -x "$RUNNER_TEMP/obsidian-${OBSIDIAN_VERSION}/obsidian"

      - name: Prepare isolated vault
        shell: bash
        env:
          OBSIDIAN_VERSION: ${{ matrix.obsidian }}
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home-${OBSIDIAN_VERSION}"
          vault="$RUNNER_TEMP/vault-${OBSIDIAN_VERSION}"
          mkdir -p "$home/.config/obsidian" "$vault/.obsidian/plugins/chapter-pipeline"
          cp main.js manifest.json styles.css "$vault/.obsidian/plugins/chapter-pipeline/"
          printf '{}\n' > "$vault/.obsidian/app.json"
          printf '["chapter-pipeline"]\n' > "$vault/.obsidian/community-plugins.json"
          printf '{}\n' > "$home/.config/obsidian/issue15smoke.json"
          cat > "$vault/Smoke.md" <<'EOF'
          # Chapter One
          Intro text with $E=mc^2$.

          ## Section A
          Body A.

          ### Detail A.1
          More text.

          ## Section B
          Body B.
          EOF
          VAULT="$vault" node <<'NODE'
          const fs = require('node:fs');
          const config = { vaults: { issue15smoke: { path: process.env.VAULT, ts: Date.now(), open: true } } };
          fs.writeFileSync(process.env.RUNNER_TEMP + `/home-${process.env.OBSIDIAN_VERSION}/.config/obsidian/obsidian.json`, JSON.stringify(config));
          NODE

      - name: Run real-app plugin smoke test
        shell: bash
        env:
          OBSIDIAN_VERSION: ${{ matrix.obsidian }}
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home-${OBSIDIAN_VERSION}"
          app="$RUNNER_TEMP/obsidian-${OBSIDIAN_VERSION}/obsidian"
          port=$((9222 + ${{ strategy.job-index }}))

          cat > "$RUNNER_TEMP/smoke.mjs" <<'NODE'
          const port = Number(process.env.CDP_PORT);
          const expected = process.env.OBSIDIAN_VERSION;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getTarget() {
            for (let i = 0; i < 120; i++) {
              try {
                const response = await fetch(`http://127.0.0.1:${port}/json`);
                const targets = await response.json();
                const target = targets.find((item) => item.type === 'page' && item.webSocketDebuggerUrl);
                if (target) return target;
              } catch {}
              await sleep(250);
            }
            throw new Error('DevTools target did not become available');
          }

          const target = await getTarget();
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          const runtimeErrors = [];
          ws.addEventListener('message', (event) => {
            const message = JSON.parse(event.data);
            if (!message.id) {
              if (message.method === 'Runtime.exceptionThrown') runtimeErrors.push(JSON.stringify(message.params?.exceptionDetails));
              if (message.method === 'Runtime.consoleAPICalled' && message.params?.type === 'error') {
                runtimeErrors.push((message.params?.args || []).map((arg) => arg.value ?? arg.description ?? '').join(' '));
              }
              return;
            }
            if (!pending.has(message.id)) return;
            const handlers = pending.get(message.id);
            pending.delete(message.id);
            message.error ? handlers.reject(new Error(JSON.stringify(message.error))) : handlers.resolve(message.result);
          });

          function send(method, params = {}) {
            const messageId = ++id;
            return new Promise((resolve, reject) => {
              pending.set(messageId, { resolve, reject });
              ws.send(JSON.stringify({ id: messageId, method, params }));
            });
          }

          async function evaluate(expression) {
            const reply = await send('Runtime.evaluate', { expression, awaitPromise: true, returnByValue: true, userGesture: true });
            if (reply.exceptionDetails) throw new Error(reply.exceptionDetails.exception?.description || reply.exceptionDetails.text);
            return reply.result?.value;
          }

          await send('Runtime.enable');

          let result;
          try {
            result = await evaluate(`(async () => {
              const sleep = (ms) => new Promise(r => setTimeout(r, ms));
              for (let i = 0; i < 120 && !globalThis.app?.plugins; i++) await sleep(250);
              if (!globalThis.app?.plugins) throw new Error('Obsidian plugin manager did not initialize');

              const pluginId = 'chapter-pipeline';
              const restrictedBefore = typeof app.plugins.isEnabled === 'function' ? !app.plugins.isEnabled() : null;
              if (typeof app.plugins.isEnabled === 'function' && !app.plugins.isEnabled()) {
                await app.plugins.setEnable(true);
                await sleep(500);
              }
              const restrictedAfter = typeof app.plugins.isEnabled === 'function' ? !app.plugins.isEnabled() : null;
              if (restrictedAfter === true) throw new Error('Could not disable Obsidian Restricted Mode');

              if (!app.plugins.manifests?.[pluginId] && typeof app.plugins.loadManifests === 'function') await app.plugins.loadManifests();
              if (!app.plugins.plugins?.[pluginId]) await app.plugins.loadPlugin(pluginId);
              for (let i = 0; i < 40 && !app.plugins.plugins?.[pluginId]; i++) await sleep(250);
              if (!app.plugins.plugins?.[pluginId]) throw new Error('Plugin did not load');

              const file = app.vault.getAbstractFileByPath('Smoke.md');
              if (!file) throw new Error('Smoke.md missing');
              const leaf = app.workspace.getLeaf(false);

              await leaf.setViewState({ type: 'markdown', state: { file: 'Smoke.md', mode: 'preview' }, active: true });
              await sleep(1800);
              const readingDashes = document.querySelectorAll('.codex-dash-item').length;
              if (readingDashes < 3) throw new Error('Reading View chapter rail missing; dashes=' + readingDashes);

              await leaf.setViewState({ type: 'markdown', state: { file: 'Smoke.md', mode: 'source' }, active: true });
              await sleep(1800);
              const liveDashes = document.querySelectorAll('.codex-dash-item').length;
              if (liveDashes < 3) throw new Error('Live Preview/source chapter rail missing; dashes=' + liveDashes);

              const commandKeys = Object.keys(app.commands.commands || {}).filter(id => id.includes(pluginId));
              if (commandKeys.length < 3) {
                throw new Error('Chapter Pipeline commands missing; keys=' + JSON.stringify(commandKeys));
              }

              await app.plugins.unloadPlugin(pluginId);
              await sleep(400);
              if (app.plugins.plugins?.[pluginId]) throw new Error('Plugin did not unload cleanly');
              await app.plugins.loadPlugin(pluginId);
              await sleep(1200);
              if (!app.plugins.plugins?.[pluginId]) throw new Error('Plugin did not reload cleanly');

              return {
                restrictedBefore,
                restrictedAfter,
                readingDashes,
                liveDashes,
                commands: commandKeys.length,
                commandKeys
              };
            })()`);
          } catch (error) {
            console.error(error.stack || error);
            if (runtimeErrors.length) console.error('Renderer errors:\n' + runtimeErrors.join('\n---\n'));
            process.exitCode = 1;
            ws.close();
            await sleep(100);
            process.exit();
          }

          console.log(JSON.stringify(result));
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Obsidian ${expected} real-app smoke\n\n` +
            `- Restricted Mode initially: ${result.restrictedBefore}\n` +
            `- Restricted Mode after setup: ${result.restrictedAfter}\n` +
            `- Reading View dashes: ${result.readingDashes}\n` +
            `- Live Preview/source dashes: ${result.liveDashes}\n` +
            `- Registered plugin commands: ${result.commands}\n` +
            `- Unload/reload: passed\n` +
            `- Result: **PASS**\n`);
          ws.close();
          NODE

          export HOME="$home"
          export XDG_CONFIG_HOME="$home/.config"
          export CDP_PORT="$port"
          xvfb-run -a "$app" --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port="$port" >"$RUNNER_TEMP/obsidian-${OBSIDIAN_VERSION}.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          node "$RUNNER_TEMP/smoke.mjs"

      - name: Show Obsidian log on failure
        if: failure()
        shell: bash
        env:
          OBSIDIAN_VERSION: ${{ matrix.obsidian }}
        run: tail -n 200 "$RUNNER_TEMP/obsidian-${OBSIDIAN_VERSION}.log" || true
