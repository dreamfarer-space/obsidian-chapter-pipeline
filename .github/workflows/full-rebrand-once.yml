name: One-off full Chapter Pipeline rebrand

on:
  push:
    branches:
      - fix/chapter-pipeline-full-rebrand

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Replace every legacy charter identifier outside workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = (
              ('CHARTER', 'CHAPTER'),
              ('Charter', 'Chapter'),
              ('charter', 'chapter'),
          )

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode())
              if str(path).startswith('.github/workflows/') or not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Audit plugin identity and zero legacy identifiers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import sys

          failures = []
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode())
              if str(path).startswith('.github/workflows/') or not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'charter' in text.lower():
                  failures.append(f'{path}: contains legacy charter identifier')

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          if manifest.get('id') != 'chapter-pipeline':
              failures.append('manifest.json: plugin id must stay chapter-pipeline')
          if manifest.get('name') != 'Chapter Pipeline':
              failures.append('manifest.json: display name must be Chapter Pipeline')
          if package.get('name') != 'obsidian-chapter-pipeline':
              failures.append('package.json: package name must be obsidian-chapter-pipeline')

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit verified non-workflow changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --check
          git commit -m "fix: complete Chapter Pipeline rebrand"
          git push origin HEAD:fix/chapter-pipeline-full-rebrand
