name: Temporary bundle artifact

on:
  push:
    branches: [refactor/issue-32-session-coordinator]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-32-session-coordinator
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated bundle when changed
        shell: bash
        run: |
          if git diff --quiet -- main.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "build: refresh committed bundle"
          git push origin HEAD:refactor/issue-32-session-coordinator
