name: Temporary scroll cleanup bridge refactor

on:
  push:
    branches: [refactor/issue-32-scroll-cleanup-bridge]

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-32-scroll-cleanup-bridge
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Encapsulate legacy scroll cleanup in render bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f'expected patch context not found in {path_str}')

          replace_once(
              'src/main.ts',
              '''interface LegacyScrollBinding {\n  scrollers?: Array<{ removeEventListener?: (...args: unknown[]) => void }>;\n  scroller?: { removeEventListener?: (...args: unknown[]) => void };\n  handler?: (...args: unknown[]) => void;\n}\n\n''',
              ''''''
          )
          replace_once(
              'src/main.ts',
              '''  trackingContainer: HTMLElement | null;\n  mode: 'reading' | 'live-preview';\n''',
              '''  trackingContainer: HTMLElement | null;\n  releaseLegacyScrollTracking: () => void;\n  mode: 'reading' | 'live-preview';\n'''
          )
          replace_once(
              'src/main.ts',
              '''  soundEngine?: { playScrollTick?: (volume: number) => void };\n  scrollBindings?: Map<unknown, LegacyScrollBinding>;\n  sessionCoordinator?: SessionCoordinator<object, ViewSession>;\n''',
              '''  soundEngine?: { playScrollTick?: (volume: number) => void };\n  sessionCoordinator?: SessionCoordinator<object, ViewSession>;\n'''
          )
          replace_once(
              'src/main.ts',
              '''/** Remove the compatibility renderer's scroll listener before typed tracking takes ownership. */\nfunction removeLegacyScrollBinding(plugin: ProductionPlugin, container: HTMLElement): void {\n  const binding = plugin.scrollBindings?.get(container);\n  if (!binding) return;\n  const scrollers = binding.scrollers ?? (binding.scroller ? [binding.scroller] : []);\n  if (binding.handler) {\n    scrollers.forEach((scroller) => scroller?.removeEventListener?.('scroll', binding.handler, true));\n  }\n  plugin.scrollBindings?.delete(container);\n}\n\n''',
              ''''''
          )
          replace_once(
              'src/main.ts',
              '''      railIndicator,\n      trackingContainer: scroller,\n      mode\n''',
              '''      railIndicator,\n      trackingContainer: scroller,\n      releaseLegacyScrollTracking,\n      mode\n'''
          )
          replace_once(
              'src/main.ts',
              '''    removeLegacyScrollBinding(this, container);\n''',
              '''    releaseLegacyScrollTracking();\n'''
          )

          replace_once(
              'src/legacy-main.js',
              '''      railIndicator,\n      trackingContainer: scrollers[0] || this.getViewScroller(container, view) || null,\n      mode: this.isReadingMode(view, container) ? 'reading' : 'live-preview'\n''',
              '''      railIndicator,\n      trackingContainer: scrollers[0] || this.getViewScroller(container, view) || null,\n      releaseLegacyScrollTracking: () => {\n        scrollers.forEach((scroller) => scroller?.removeEventListener?.('scroll', throttledScroll, true));\n        const currentBinding = this.scrollBindings.get(container);\n        if (currentBinding?.handler === throttledScroll) this.scrollBindings.delete(container);\n      },\n      mode: this.isReadingMode(view, container) ? 'reading' : 'live-preview'\n'''
          )
          PY
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Commit source and generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/legacy-main.js main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: encapsulate legacy scroll cleanup"
          git push origin HEAD:refactor/issue-32-scroll-cleanup-bridge
