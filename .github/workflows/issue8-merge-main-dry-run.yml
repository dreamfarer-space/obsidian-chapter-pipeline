name: Issue 8 merge latest main

on:
  push:
    paths:
      - '.github/workflows/issue8-merge-main-dry-run.yml'

permissions:
  contents: write

jobs:
  merge-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-8-view-sessions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Merge latest main and resolve typed-runtime conflict
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(main\.js|src/main\.ts)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts:"
              echo "$unexpected"
              exit 1
            fi
          fi

          git checkout --ours src/main.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.ts')
          s = p.read_text()
          import_line = "import { ChapterPipelineSettingTab as TypedChapterPipelineSettingTab } from './ui/settings-tab';\n"
          perf_import = "import { applyRuntimePerformancePatches } from './runtime-performance';\n"
          if perf_import not in s:
              if import_line not in s:
                  raise SystemExit('main.ts import marker missing')
              s = s.replace(import_line, import_line + perf_import, 1)
          marker = "};\n\n/** Remove the compatibility renderer's scroll listener before typed tracking takes ownership. */"
          call = "};\n\napplyRuntimePerformancePatches(LegacyPlugin as never);\n\n/** Remove the compatibility renderer's scroll listener before typed tracking takes ownership. */"
          if 'applyRuntimePerformancePatches(LegacyPlugin as never);' not in s:
              if marker not in s:
                  raise SystemExit('main.ts runtime patch marker missing')
              s = s.replace(marker, call, 1)
          p.write_text(s)
          PY
          git add src/main.ts
          git checkout --ours main.js
          git add main.js

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Remaining conflicts:'
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Commit merge
        run: |
          git add -A
          git commit -m "merge: sync latest main into issue 8 refactor"
          git push origin HEAD:refactor/issue-8-view-sessions
