name: Temporary typed plugin subclass validation

on:
  push:
    branches: [refactor/issue-32-typed-plugin-subclass]

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-32-typed-plugin-subclass
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Commit generated bundle when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh typed plugin subclass bundle"
          git push origin HEAD:refactor/issue-32-typed-plugin-subclass
