name: Temporary render bridge wrapper fix

on:
  push:
    branches: [refactor/issue-32-render-result-bridge]

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-32-render-result-bridge
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Forward the explicit render result through reading persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/reading-persistence.ts')
          text = path.read_text()
          old = '''  const legacyAttach = prototype.attachStepperToView;\n  if (typeof legacyAttach === 'function') {\n    prototype.attachStepperToView = async function (this: ReadingAwarePlugin, view: object): Promise<void> {\n      await legacyAttach.call(this, view);\n      const typedView = view as { file?: FileLike };\n      const chapters = this.viewChapterSnapshots?.get(view);\n      if (typedView.file?.path && chapters?.length) rememberFileChapterSnapshot(this, typedView.file.path, chapters);\n    };\n  }\n'''
          new = '''  const legacyAttach = prototype.attachStepperToView;\n  if (typeof legacyAttach === 'function') {\n    prototype.attachStepperToView = async function (this: ReadingAwarePlugin, view: object) {\n      const rendered = await legacyAttach.call(this, view) as { chapters?: ChapterNode[] } | undefined;\n      const typedView = view as { file?: FileLike };\n      const chapters = rendered?.chapters ?? this.viewChapterSnapshots?.get(view);\n      if (typedView.file?.path && chapters?.length) rememberFileChapterSnapshot(this, typedView.file.path, chapters);\n      return rendered;\n    };\n  }\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('reading persistence attach wrapper context not found')
          PY
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Commit wrapper fix and generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/reading-persistence.ts main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: forward render resources through persistence wrapper"
          git push origin HEAD:refactor/issue-32-render-result-bridge
