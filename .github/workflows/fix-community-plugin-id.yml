name: Fix Community Plugin ID

on:
  push:
    branches: [fix/community-plugin-id]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/community-plugin-id
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore established plugin ID everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            '.github/workflows/release.yml': [
              ('charter-pipeline-$VERSION.zip', 'chapter-pipeline-$VERSION.zip'),
            ],
            'README.md': [
              ('`charter-pipeline-<version>.zip`', '`chapter-pipeline-<version>.zip`'),
              ('/.obsidian/plugins/charter-pipeline/', '/.obsidian/plugins/chapter-pipeline/'),
            ],
            'README.zh-CN.md': [
              ('`charter-pipeline-<version>.zip`', '`chapter-pipeline-<version>.zip`'),
              ('/.obsidian/plugins/charter-pipeline/', '/.obsidian/plugins/chapter-pipeline/'),
            ],
            'docs/COMMUNITY_SUBMISSION.md': [
              ('- Plugin ID: `charter-pipeline`', '- Plugin ID: `chapter-pipeline`'),
              ('The plugin ID is intentionally finalized before the first Community Plugins release so users do not inherit a directory rename after installation.', 'The plugin ID remains `chapter-pipeline` because it is the existing registered plugin identifier. Community Plugins submissions must keep that identifier stable.'),
            ],
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'missing expected text in {filename}: {old}')
              text = text.replace(old, new)
            path.write_text(text)

          manifest = Path('manifest.json').read_text()
          if '"id": "chapter-pipeline"' not in manifest:
            raise SystemExit('manifest id is not chapter-pipeline')
          PY
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verify identity consistency
        shell: bash
        run: |
          test "$(node -p "require('./manifest.json').id")" = "chapter-pipeline"
          grep -Fq 'chapter-pipeline-$VERSION.zip' .github/workflows/release.yml
          grep -Fq '.obsidian/plugins/chapter-pipeline/' README.md
          grep -Fq '.obsidian/plugins/chapter-pipeline/' README.zh-CN.md
          grep -Fq 'Plugin ID: `chapter-pipeline`' docs/COMMUNITY_SUBMISSION.md
          git diff --exit-code -- main.js
      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-community-plugin-id.yml
          git add manifest.json .github/workflows/release.yml README.md README.zh-CN.md docs/COMMUNITY_SUBMISSION.md
          git commit -m "fix: preserve existing Obsidian plugin id"
          git push origin HEAD:fix/community-plugin-id
