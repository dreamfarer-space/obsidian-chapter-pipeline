name: Issue 15 Version Sync

on:
  push:
    branches:
      - chore/issue-15-community-submission-final

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/issue-15-community-submission-final
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify versions
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='1.2.2'||l.version!=='1.2.2'||l.packages[''].version!=='1.2.2') process.exit(1)"

      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "release: sync lockfile for 1.2.2"
          git push origin HEAD:chore/issue-15-community-submission-final
