name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Reject legacy naming residue
        shell: bash
        run: |
          LEGACY="char""ter"
          if git grep -ni "$LEGACY" -- .; then
            echo "Repository contains legacy naming residue" >&2
            exit 1
          fi

      - name: Reject production Pro/debug branding
        run: |
          if grep -Fq "Chapter Pipeline Pro" main.js; then
            echo "Production bundle still contains Pro/debug branding" >&2
            exit 1
          fi

      - name: Verify generated bundle is committed
        run: git diff --exit-code -- main.js
