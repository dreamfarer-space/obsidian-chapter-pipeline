name: Issue 8 finalize temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add production typed-session integration assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('main.test.js')
          text = path.read_text()
          anchor = "  assert.equal(disabledHarness.sourceScroller.listeners.get('scroll'), undefined);\n"
          insertion = """  const readingSession = disabledHarness.plugin.viewSessions?.get(disabledHarness.view);\n  assert.ok(readingSession instanceof ChapterPipelinePlugin.ViewSession);\n  assert.ok(readingSession.tracker instanceof ChapterPipelinePlugin.ReadingViewTracker);\n  assert.equal(disabledHarness.plugin.scrollBindings.has(disabledHarness.container), false);\n"""
          if insertion not in text:
              if anchor not in text:
                  raise SystemExit('reading integration anchor not found')
              text = text.replace(anchor, anchor + insertion, 1)

          live_anchor = "  assert.equal(enabledHarness.container.querySelector('.codex-stepper-container').classList.contains('show-chapter-order'), true);\n"
          live_insertion = """\n  const liveHarness = createReadingHarness();\n  liveHarness.view.getMode = () => 'source';\n  await liveHarness.plugin.attachStepperToView(liveHarness.view);\n  const liveSession = liveHarness.plugin.viewSessions?.get(liveHarness.view);\n  assert.ok(liveSession instanceof ChapterPipelinePlugin.ViewSession);\n  assert.ok(liveSession.tracker instanceof ChapterPipelinePlugin.LivePreviewTracker);\n  assert.equal(liveHarness.sourceScroller.listeners.get('scroll')?.length, 1);\n"""
          if live_insertion not in text:
              if live_anchor not in text:
                  raise SystemExit('live-preview integration anchor not found')
              text = text.replace(live_anchor, live_anchor + live_insertion, 1)
          path.write_text(text)
          PY
      - run: npm test
      - name: Commit generated bundle and integration tests
        run: |
          if git diff --quiet -- main.js main.test.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js main.test.js
          git commit -m "test: cover production typed view sessions"
          git push origin HEAD:${{ github.head_ref }}
