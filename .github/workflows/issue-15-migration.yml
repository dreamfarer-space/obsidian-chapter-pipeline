name: Issue 15 one-time migration

on:
  push:
    branches:
      - chore/issue-15-community-submission-gate

permissions:
  contents: write

jobs:
  migrate-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: chore/issue-15-community-submission-gate

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Normalize final project branding
        shell: python
        run: |
          from pathlib import Path

          explicit = [
              Path('src/legacy-main.js'),
              Path('styles.css'),
              Path('package.json'),
              Path('package-lock.json'),
          ]
          explicit += list(Path('src').rglob('*.ts'))
          explicit += list(Path('.').glob('*.test.js'))
          explicit += list(Path('docs').rglob('*.md'))
          explicit += list(Path('.').glob('README*.md'))

          seen = set()
          for path in explicit:
              if path in seen or not path.exists():
                  continue
              seen.add(path)
              text = path.read_text(encoding='utf-8')
              if path.as_posix() == 'src/legacy-main.js':
                  text = text.replace("    console.log('Loading Charter Pipeline Pro with Bilingual Settings & Tactile Sound...');\n\n", '')
                  text = text.replace("    console.log('Unloading Charter Pipeline Pro');\n", '')
              text = text.replace('Charter Pipeline', 'Chapter Pipeline')
              text = text.replace('obsidian-charter-pipeline', 'obsidian-chapter-pipeline')
              path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Validate release metadata
        run: node scripts/validate-release.mjs

      - name: Verify legacy Pro branding is gone
        run: |
          if grep -R -n -E "(Charter|Chapter) Pipeline Pro" src main.js; then
            echo "Legacy Pro branding remains" >&2
            exit 1
          fi

      - name: Verify final display branding
        run: |
          if grep -R -n -F "Charter Pipeline" src README.md README.zh-CN.md manifest.json main.js; then
            echo "Legacy Charter Pipeline branding remains in shipped/runtime surfaces" >&2
            exit 1
          fi

      - name: Commit normalized sources and generated bundle
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src styles.css package.json package-lock.json '*.test.js' docs README.md README.zh-CN.md main.js
          git commit -m "chore: finish Chapter Pipeline branding cleanup"
          git push origin HEAD:chore/issue-15-community-submission-gate
