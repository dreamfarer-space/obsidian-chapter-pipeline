name: Issue 13 verification

on:
  push:
    branches:
      - fix/issue-13-reading-bookmark-identity

permissions:
  contents: write

jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-13-reading-bookmark-identity
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply final compatibility patch
        run: node scripts/finalize-issue-13.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Build bundle for tests
        run: npm run build
      - name: Test
        run: npm test
      - name: Commit verified source and bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts main.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "fix: finalize resilient reading bookmark identity"
            git push origin HEAD:fix/issue-13-reading-bookmark-identity
          fi
