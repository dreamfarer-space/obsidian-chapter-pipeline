name: Issue 8 final fixes

on:
  push:
    paths:
      - '.github/workflows/issue8-final-fixes-temp.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-8-view-sessions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply final review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('src/main.ts')
          s = main.read_text()

          old_sound = """        if (previousIndex >= 0 && previousIndex !== index) {\n          if (this.settings?.enableSound !== false) {\n            const volume = typeof this.settings?.soundVolume === 'number' ? this.settings.soundVolume : 50;\n            this.soundEngine?.playScrollTick?.(volume);\n          }\n          this.recordReadingPosition?.(view, chapters[index]);\n        }\n"""
          new_sound = """        if (previousIndex >= 0 && previousIndex !== index) {\n          const volume = typeof this.settings?.soundVolume === 'number' ? this.settings.soundVolume : 50;\n          this.soundEngine?.playScrollTick?.(volume);\n          this.recordReadingPosition?.(view, chapters[index]);\n        }\n"""
          if old_sound not in s:
              raise SystemExit('sound block marker missing')
          s = s.replace(old_sound, new_sound, 1)

          old_validation = """    if (this.viewSessionVersions.get(view) !== sessionVersion || typedView.contentEl !== container) {\n      session.dispose();\n      return;\n    }\n    this.viewSessions.set(view, session);\n"""
          new_validation = """    const markdownLeaves = this.app?.workspace?.getLeavesOfType?.('markdown');\n    const isMounted = markdownLeaves === undefined || markdownLeaves.some((leaf) => leaf?.view === view);\n    if (this.viewSessionVersions.get(view) !== sessionVersion || typedView.contentEl !== container || !isMounted) {\n      session.dispose();\n      return;\n    }\n    this.viewSessions.set(view, session);\n"""
          if old_validation not in s:
              raise SystemExit('session validation marker missing')
          s = s.replace(old_validation, new_validation, 1)
          main.write_text(s)

          tests = Path('main.test.js')
          t = tests.read_text()
          anchor = """test('typed sessions keep the rendered per-view chapter snapshot during resume lookup', async () => {\n"""
          if anchor not in t:
              raise SystemExit('test insertion anchor missing')

          additions = r"""test('typed scroll ticks delegate independently of tactile click sound setting', async () => {
  const harness = createReadingHarness();
  harness.plugin.settings.enableSound = false;
  harness.plugin.settings.enableScrollSound = true;
  let scrollTicks = 0;
  harness.plugin.soundEngine.playScrollTick = () => { scrollTicks += 1; };

  await harness.plugin.attachStepperToView(harness.view);
  harness.scroller.scrollTop = 1;
  harness.scroller.dispatch('scroll');
  assert.equal(scrollTicks, 0);

  harness.scroller.scrollTop = 400;
  harness.scroller.dispatch('scroll');
  assert.equal(scrollTicks, 1);
});

test('typed attachment discards a session when the view closes during cachedRead', async () => {
  const harness = createReadingHarness();
  let resolveRead;
  harness.app.vault.cachedRead = () => new Promise((resolve) => { resolveRead = resolve; });

  const attach = harness.plugin.attachStepperToView(harness.view);
  harness.app.workspace.getLeavesOfType = () => [];
  resolveRead('# First\nbody\nbody\nbody\n## Second\nbody');
  await attach;

  assert.equal(harness.plugin.viewSessions?.has(harness.view), false);
  assert.equal(harness.scroller.listeners.get('scroll')?.length ?? 0, 0);
  assert.equal(harness.plugin.scrollBindings.has(harness.container), false);
  assert.equal(harness.container.querySelector('.codex-stepper-container'), null);
});

"""
          t = t.replace(anchor, additions + anchor, 1)
          tests.write_text(t)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Commit validated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.ts main.test.js main.js
          git commit -m "fix: finalize typed session lifecycle semantics"
          git push origin HEAD:refactor/issue-8-view-sessions
