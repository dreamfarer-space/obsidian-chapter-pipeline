name: Issue 8 final fixes

on:
  push:
    paths:
      - '.github/workflows/issue8-final-fixes-temp.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-8-view-sessions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply final review fixes
        run: python .github/scripts/issue8_final_fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Commit validated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.ts main.test.js main.js
          git commit -m "fix: finalize typed session lifecycle semantics"
          git push origin HEAD:refactor/issue-8-view-sessions
