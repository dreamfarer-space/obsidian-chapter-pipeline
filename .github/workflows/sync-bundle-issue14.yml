name: Sync issue 14 bundle

on:
  push:
    branches: [feature/issue-14]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/issue-14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet -- main.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "build: sync issue 14 production bundle"
          git push origin HEAD:feature/issue-14
