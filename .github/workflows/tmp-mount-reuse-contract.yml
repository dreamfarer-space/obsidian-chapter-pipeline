name: Temporary mount reuse contract refactor

on:
  push:
    branches: [refactor/issue-32-mount-reuse-contract]

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/issue-32-mount-reuse-contract
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Move mount identity checks behind session contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f'expected patch context not found in {path_str}')

          replace_once(
              'src/legacy-main.js',
              '''    // Explicit compatibility contract for the typed production session. Keep\n    // legacy rendering internals private instead of making typed code recover\n    // the same resources through maps and DOM selectors.\n    return {\n      hostContainer: container,\n      chapters,\n      stepperElement: stepperContainer,\n      dashElements,\n      tooltipElement: floatingTooltip,\n      railIndicator,\n      trackingContainer: scrollers[0] || this.getViewScroller(container, view) || null,\n      releaseLegacyScrollTracking: () => {\n        scrollers.forEach((scroller) => scroller?.removeEventListener?.('scroll', throttledScroll, true));\n        const currentBinding = this.scrollBindings.get(container);\n        if (currentBinding?.handler === throttledScroll) this.scrollBindings.delete(container);\n      },\n      mode: this.isReadingMode(view, container) ? 'reading' : 'live-preview'\n    };\n''',
              '''    const trackingContainer = scrollers[0] || this.getViewScroller(container, view) || null;\n    const mode = this.isReadingMode(view, container) ? 'reading' : 'live-preview';\n\n    // Explicit compatibility contract for the typed production session. Keep\n    // legacy rendering internals private instead of making typed code recover\n    // the same resources through maps and DOM selectors.\n    return {\n      hostContainer: container,\n      chapters,\n      stepperElement: stepperContainer,\n      dashElements,\n      tooltipElement: floatingTooltip,\n      railIndicator,\n      trackingContainer,\n      releaseLegacyScrollTracking: () => {\n        scrollers.forEach((scroller) => scroller?.removeEventListener?.('scroll', throttledScroll, true));\n        const currentBinding = this.scrollBindings.get(container);\n        if (currentBinding?.handler === throttledScroll) this.scrollBindings.delete(container);\n      },\n      isCurrentMount: () => {\n        if (view?.contentEl !== container) return false;\n        if (container.querySelector('.codex-stepper-container') !== stepperContainer) return false;\n        const currentMode = this.isReadingMode(view, container) ? 'reading' : 'live-preview';\n        if (currentMode !== mode) return false;\n        const currentTrackingContainer = currentMode === 'reading'\n          ? this.getViewScroller(container, view) || container.querySelector('.markdown-preview-view')\n          : this.getViewScroller(container, view) || container.querySelector('.cm-scroller');\n        return currentTrackingContainer === trackingContainer;\n      },\n      mode\n    };\n'''
          )

          replace_once(
              'src/views/view-session.ts',
              '''  trackImmediately?: boolean;\n}\n''',
              '''  trackImmediately?: boolean;\n  /** Validate that the adopted DOM/scroller resources are still the mounted resources for this view. */\n  isCurrentMount?: () => boolean;\n}\n'''
          )
          replace_once(
              'src/views/view-session.ts',
              '''  getActiveIndex(): number {\n    return this.activeIndex;\n  }\n\n  /** Release the tracker, UI adapters, and chapter snapshot for this view. */\n''',
              '''  getActiveIndex(): number {\n    return this.activeIndex;\n  }\n\n  /** Return false when the adopted legacy render resources were replaced or the view mode changed. */\n  isCurrentMount(): boolean {\n    if (this.disposed) return false;\n    return this.options.isCurrentMount?.() ?? true;\n  }\n\n  /** Release the tracker, UI adapters, and chapter snapshot for this view. */\n'''
          )

          replace_once(
              'src/views/render-signature.ts',
              '''  isReadingMode?: (view: object, container?: HTMLElement | null) => boolean;\n''',
              ''''''
          )
          replace_once(
              'src/views/render-signature.ts',
              '''interface ViewLike {\n  file?: FileLike;\n  contentEl?: HTMLElement;\n}\n''',
              '''interface ViewLike {\n  file?: FileLike;\n}\n'''
          )
          replace_once(
              'src/views/render-signature.ts',
              '''  const mode = plugin.isReadingMode?.(view, host.contentEl ?? null) === true ? 'reading' : 'live-preview';\n\n''',
              ''''''
          )
          replace_once(
              'src/views/render-signature.ts',
              '''    plugin.documentRevisions?.get(filePath) ?? 0,\n    mode,\n    headings.length,\n''',
              '''    plugin.documentRevisions?.get(filePath) ?? 0,\n    headings.length,\n'''
          )
          replace_once(
              'src/views/render-signature.ts',
              '''/** Return true only when the signature and both adopted resource owners still match. */\nexport function canReuseRenderedSession(\n  session: {\n    renderSignature: string;\n    stepper: { element: HTMLElement };\n    trackingContainer: HTMLElement;\n  } | undefined,\n  renderSignature: string,\n  mountedStepper: HTMLElement | null,\n  mountedTrackingContainer: HTMLElement | null\n): boolean {\n  return Boolean(\n    session\n    && session.renderSignature === renderSignature\n    && mountedStepper\n    && session.stepper.element === mountedStepper\n    && mountedTrackingContainer\n    && session.trackingContainer === mountedTrackingContainer\n  );\n}\n''',
              '''/** Return true only when the structural signature matches and the session still owns the current mount. */\nexport function canReuseRenderedSession(\n  session: {\n    renderSignature: string;\n    isCurrentMount: () => boolean;\n  } | undefined,\n  renderSignature: string\n): boolean {\n  return Boolean(\n    session\n    && session.renderSignature === renderSignature\n    && session.isCurrentMount()\n  );\n}\n'''
          )

          replace_once(
              'src/main.ts',
              '''  trackingContainer: HTMLElement | null;\n  releaseLegacyScrollTracking: () => void;\n  mode: 'reading' | 'live-preview';\n''',
              '''  trackingContainer: HTMLElement | null;\n  releaseLegacyScrollTracking: () => void;\n  isCurrentMount: () => boolean;\n  mode: 'reading' | 'live-preview';\n'''
          )
          replace_once(
              'src/main.ts',
              '''  getReadingHeading?: (view: object, chapter: ChapterNode) => Element | null;\n  getViewScroller?: (container: HTMLElement, view: object) => HTMLElement | null;\n  isActiveMarkdownView?: (view: object) => boolean;\n  isReadingMode?: (view: object, container?: HTMLElement | null) => boolean;\n  jumpToHeading?: (view: object, chapter: ChapterNode) => void;\n''',
              '''  getReadingHeading?: (view: object, chapter: ChapterNode) => Element | null;\n  isActiveMarkdownView?: (view: object) => boolean;\n  jumpToHeading?: (view: object, chapter: ChapterNode) => void;\n'''
          )
          replace_once(
              'src/main.ts',
              '''      trackingContainer: scroller,\n      releaseLegacyScrollTracking,\n      mode\n''',
              '''      trackingContainer: scroller,\n      releaseLegacyScrollTracking,\n      isCurrentMount,\n      mode\n'''
          )
          replace_once(
              'src/main.ts',
              '''      shouldTrack: () => this.isActiveMarkdownView?.(view) !== false,\n      trackImmediately: false,\n''',
              '''      shouldTrack: () => this.isActiveMarkdownView?.(view) !== false,\n      trackImmediately: false,\n      isCurrentMount,\n'''
          )
          replace_once(
              'src/main.ts',
              '''        const typedView = view as { contentEl?: HTMLElement };\n        const container = typedView.contentEl;\n        const mountedStepper = container?.querySelector('.codex-stepper-container') as HTMLElement | null;\n        const isReading = container ? this.isReadingMode?.(view, container) === true : false;\n        const mountedTrackingContainer = container\n          ? (isReading\n            ? this.getViewScroller?.(container, view) ?? (container.querySelector('.markdown-preview-view') as HTMLElement | null)\n            : this.getViewScroller?.(container, view) ?? (container.querySelector('.cm-scroller') as HTMLElement | null))\n          : null;\n        const renderSignature = buildViewRenderSignature(this, view);\n        if (canReuseRenderedSession(\n          coordinator.get(view),\n          renderSignature,\n          mountedStepper,\n          mountedTrackingContainer\n        )) return;\n''',
              '''        const renderSignature = buildViewRenderSignature(this, view);\n        if (canReuseRenderedSession(coordinator.get(view), renderSignature)) return;\n'''
          )

          replace_once(
              'tests/session-reuse.test.js',
              '''test('session reuse requires identical signature, stepper, and tracking scroller identity', () => {\n  const { canReuseRenderedSession } = loadRenderSignatureModule();\n  const stepper = {};\n  const scroller = {};\n  const session = {\n    renderSignature: 'same',\n    stepper: { element: stepper },\n    trackingContainer: scroller,\n  };\n  assert.equal(canReuseRenderedSession(session, 'same', stepper, scroller), true);\n  assert.equal(canReuseRenderedSession(session, 'changed', stepper, scroller), false);\n  assert.equal(canReuseRenderedSession(session, 'same', {}, scroller), false);\n  assert.equal(canReuseRenderedSession(session, 'same', stepper, {}), false);\n  assert.equal(canReuseRenderedSession(undefined, 'same', stepper, scroller), false);\n});\n''',
              '''test('session reuse requires an identical signature and a current mount contract', () => {\n  const { canReuseRenderedSession } = loadRenderSignatureModule();\n  const currentSession = { renderSignature: 'same', isCurrentMount: () => true };\n  const replacedSession = { renderSignature: 'same', isCurrentMount: () => false };\n  assert.equal(canReuseRenderedSession(currentSession, 'same'), true);\n  assert.equal(canReuseRenderedSession(currentSession, 'changed'), false);\n  assert.equal(canReuseRenderedSession(replacedSession, 'same'), false);\n  assert.equal(canReuseRenderedSession(undefined, 'same'), false);\n});\n'''
          )
          replace_once(
              'tests/session-reuse.test.js',
              '''    trackingContainer: harness.scroller,\n    dispose() { disposed += 1; },\n''',
              '''    trackingContainer: harness.scroller,\n    isCurrentMount: () => true,\n    dispose() { disposed += 1; },\n'''
          )
          replace_once(
              'tests/session-reuse.test.js',
              '''    trackingContainer: {},\n    dispose() { disposed += 1; },\n''',
              '''    trackingContainer: {},\n    isCurrentMount: () => false,\n    dispose() { disposed += 1; },\n'''
          )
          # The structural-setting test has the same mounted scroller and should
          # remain mount-valid; the changed render signature is what invalidates it.
          text_path = Path('tests/session-reuse.test.js')
          text = text_path.read_text()
          marker = '''test('production updateAllMarkdownViews invalidates a session after a structural setting change', async () => {'''
          start = text.index(marker)
          tail = text[start:]
          old = '''    trackingContainer: harness.scroller,\n    dispose() { disposed += 1; },\n'''
          new = '''    trackingContainer: harness.scroller,\n    isCurrentMount: () => true,\n    dispose() { disposed += 1; },\n'''
          if old in tail:
              tail = tail.replace(old, new, 1)
              text_path.write_text(text[:start] + tail)
          elif new not in tail:
              raise SystemExit('structural-setting session context not found')
          PY
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Commit source, tests, and generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy-main.js src/main.ts src/views/view-session.ts src/views/render-signature.ts tests/session-reuse.test.js main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: move mount reuse checks behind session contract"
          git push origin HEAD:refactor/issue-32-mount-reuse-contract
