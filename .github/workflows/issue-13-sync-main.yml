name: Issue 13 sync with main

on:
  push:
    branches:
      - fix/issue-13-reading-bookmark-identity

permissions:
  contents: write

jobs:
  sync-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-13-reading-bookmark-identity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Merge latest main and resolve generated-file overlap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -vE '^(main\.js|package\.json)$' | grep -v '^$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            echo "$unexpected"
            exit 1
          fi
          if printf '%s\n' "$conflicts" | grep -qx 'main.js'; then
            git checkout --theirs main.js
            git add main.js
          fi
          if printf '%s\n' "$conflicts" | grep -qx 'package.json'; then
            git checkout --theirs package.json
            git add package.json
          fi
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.scripts.test.includes('reading-identity.test.js')) {
            pkg.scripts.test += ' reading-identity.test.js';
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          git add package.json
          echo "merge_status=$merge_status"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Rebuild bundle on merged sources
        run: npm run build
      - name: Test merged branch
        run: npm test
      - name: Commit merge
        run: |
          git add main.js package.json
          git commit -m "merge: sync issue 13 with latest main"
          git push origin HEAD:fix/issue-13-reading-bookmark-identity
