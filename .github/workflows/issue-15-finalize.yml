name: Finalize issue 15 branch

on:
  push:
    branches:
      - chore/issue-15-community-submission-gate

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chore/issue-15-community-submission-gate

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Remove legacy lifecycle debug branding
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/legacy-main.js')
          text = path.read_text(encoding='utf-8')
          old_load = "    console.log('Loading Charter Pipeline Pro with Bilingual Settings & Tactile Sound...');\n\n"
          old_unload = "    console.log('Unloading Charter Pipeline Pro');\n"
          if old_load not in text or old_unload not in text:
              raise SystemExit('Expected legacy lifecycle debug logs were not found')
          text = text.replace(old_load, '', 1).replace(old_unload, '', 1)
          path.write_text(text, encoding='utf-8')

      - name: Add community-readiness regression checks
        shell: bash
        run: |
          cat > community-readiness.test.js <<'EOF'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const test = require('node:test');

          const read = (path) => fs.readFileSync(path, 'utf8');
          const manifest = JSON.parse(read('manifest.json'));
          const pkg = JSON.parse(read('package.json'));
          const versions = JSON.parse(read('versions.json'));
          const legacySource = read('src/legacy-main.js');
          const releaseWorkflow = read('.github/workflows/release.yml');
          const readme = read('README.md');

          test('community submission metadata stays synchronized', () => {
            assert.equal(manifest.id, 'chapter-pipeline');
            assert.equal(pkg.version, manifest.version);
            assert.equal(versions[manifest.version], manifest.minAppVersion);
          });

          test('release workflow uses exact manifest version tags and publishes required assets', () => {
            assert.match(releaseWorkflow, /echo "tag=\$VERSION"/);
            assert.doesNotMatch(releaseWorkflow, /echo "tag=v\$VERSION"/);
            assert.match(releaseWorkflow, /gh release create "\$TAG"/);
            for (const asset of ['main.js', 'manifest.json', 'styles.css']) {
              assert.ok(releaseWorkflow.includes(asset), `release workflow should publish ${asset}`);
            }
          });

          test('legacy Pro lifecycle branding is absent from source', () => {
            assert.doesNotMatch(legacySource, /Charter Pipeline Pro/);
            assert.doesNotMatch(legacySource, /Loading Charter Pipeline/);
            assert.doesNotMatch(legacySource, /Unloading Charter Pipeline/);
          });

          test('mobile readiness hooks remain present while mobile support is declared', () => {
            assert.equal(manifest.isDesktopOnly, false);
            assert.match(legacySource, /pointerType\s*===\s*['"]touch['"]/);
            assert.match(legacySource, /addEventListener\(['"]touchstart['"]/);
            assert.match(legacySource, /classList\.add\(['"]is-narrow['"]\)/);
          });

          test('README documents the actual pre-approval installation path', () => {
            assert.match(readme, /use BRAT or a manual GitHub Release install/i);
            assert.match(readme, /\.obsidian\/plugins\/chapter-pipeline\//);
            assert.doesNotMatch(readme, /If Charter Pipeline is available in your Obsidian Community Plugins browser/i);
          });
          EOF

          node <<'EOF'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const testFile = 'community-readiness.test.js';
          if (!pkg.scripts.test.includes(testFile)) {
            pkg.scripts.test = `${pkg.scripts.test} ${testFile}`;
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          EOF

      - name: Document automated and manual gates
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/COMMUNITY_SUBMISSION.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Automated regression gate\n'
          if marker not in text:
              text += '''\n## Automated regression gate\n\n`npm test` includes `community-readiness.test.js`, which guards the finalized `chapter-pipeline` ID, manifest/package/versions synchronization, exact release tags, required release assets, removal of legacy `Pro` lifecycle branding, the pre-approval README installation path, and the presence of narrow-view/touch interaction hooks.\n\nThese automated assertions prevent packaging and source regressions, but they do **not** count as the manual Obsidian compatibility matrix above. The declared minimum Obsidian version and both mobile platforms must still be smoke-tested before the Community Plugins submission PR is opened.\n'''
              path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify production bundle and branding
        shell: bash
        run: |
          git diff --exit-code -- main.js
          ! grep -R -F "Charter Pipeline Pro" -- src main.js README.md README.zh-CN.md

      - name: Commit finalized issue 15 changes and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/issue-15-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize community submission gate"
          git push origin HEAD:chore/issue-15-community-submission-gate
