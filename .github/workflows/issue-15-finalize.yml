name: Issue 15 Finalize

on:
  push:
    branches:
      - chore/issue-15-community-submission-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/issue-15-community-submission-final
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Remove legacy runtime debug logs and fix CI guard
        shell: python
        run: |
          from pathlib import Path

          source = Path('src/legacy-main.js')
          text = source.read_text(encoding='utf-8')
          targets = [
              "    console.log('Loading Chapter Pipeline Pro with Bilingual Settings & Tactile Sound...');\n\n",
              "    console.log('Unloading Chapter Pipeline Pro');\n",
          ]
          for target in targets:
              if target not in text:
                  raise SystemExit(f'Expected runtime debug log not found: {target.strip()}')
              text = text.replace(target, '', 1)
          source.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          ci_text = ci_text.replace(
              'if grep -Eq "(Charter|Chapter) Pipeline Pro" src/legacy-main.js main.js; then',
              'if grep -Fq "Chapter Pipeline Pro" src/legacy-main.js main.js; then'
          )
          ci.write_text(ci_text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npx --no-install tsc --noEmit
          npm test

      - name: Build and validate
        run: |
          npm run build
          node scripts/validate-release.mjs
          if grep -Fq "Chapter Pipeline Pro" src/legacy-main.js main.js; then
            echo "Runtime debug branding remains" >&2
            exit 1
          fi

      - name: Commit finalized source and generated bundle
        shell: bash
        run: |
          rm .github/workflows/issue-15-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy-main.js main.js .github/workflows/ci.yml .github/workflows/issue-15-finalize.yml
          git commit -m "fix: remove remaining Community submission blockers"
          git push origin HEAD:chore/issue-15-community-submission-final
