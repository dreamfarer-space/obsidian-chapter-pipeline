name: Sync issue 15 with main

on:
  push:
    branches: [feature/issue-15]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-15
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Merge latest main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "main.js" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --ours main.js
            git add main.js
            git commit --no-edit
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify release identity
        shell: bash
        run: |
          node -e "const m=require('./manifest.json'); if(m.id!=='charter-pipeline') process.exit(1)"
          grep -Fq 'charter-pipeline-$VERSION.zip' .github/workflows/release.yml
          ! grep -Fq 'Charter Pipeline Pro' main.js
      - name: Commit rebuilt bundle and cleanup helper workflow
        shell: bash
        run: |
          git rm .github/workflows/sync-issue15-main.yml
          git add main.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync community submission branch with main"
          fi
          git push origin HEAD:feature/issue-15
