name: Rebuild perf bundle

on:
  push:
    branches: [perf/chapter-scroll-tracking]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/chapter-scroll-tracking
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- main.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.js
          git commit -m "build: refresh generated bundle"
          git push origin HEAD:perf/chapter-scroll-tracking
